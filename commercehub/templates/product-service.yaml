
apiVersion: v1
kind: Service
metadata:
  name: commercehub-product
  labels:
    app.kubernetes.io/name: commercehub-product
    app.kubernetes.io/part-of: commercehub
spec:
  type: {{ .Values.productService.service.type }}
  selector:
    app.kubernetes.io/name: commercehub-product
  ports:
    - name: http
      port: {{ .Values.productService.service.port }}
      targetPort: http
