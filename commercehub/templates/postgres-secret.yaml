
{{- if .Values.postgresql.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: commercehub-postgres
  labels:
    app.kubernetes.io/part-of: commercehub
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required when createSecret=true" .Values.postgresql.password | quote }}
{{- end }}
