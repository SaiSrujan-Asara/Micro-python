
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commercehub-product
  labels:
    app.kubernetes.io/name: commercehub-product
    app.kubernetes.io/part-of: commercehub
spec:
  replicas: {{ .Values.productService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: commercehub-product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commercehub-product
        app.kubernetes.io/part-of: commercehub
    spec:
      containers:
        - name: product-service
          image: "{{ .Values.productService.image.repository }}:{{ .Values.productService.image.tag }}"
          imagePullPolicy: {{ .Values.productService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.productService.resources | nindent 12 }}
            