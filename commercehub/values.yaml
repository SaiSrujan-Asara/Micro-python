productService:
  replicaCount: 2

  image:
    repository: product-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

orderService:
  replicaCount: 2
  image:
    repository: order-service
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  productServiceUrl: "http://commercehub-product:8000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgresql:
  createSecret: false
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  storage:
    size: 2Gi
    storageClassName: standard
  database: commercehub
  username: commercehub